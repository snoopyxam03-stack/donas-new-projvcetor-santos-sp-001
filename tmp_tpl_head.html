<style id="mobile-overrides-page">
html,body{max-width:100vw!important;overflow-x:hidden!important;}
#main-transparent{max-width:min(1004px,100vw)!important;}

@media (max-width: 900px){
  html,body{width:100%!important;max-width:100%!important;margin:0!important;padding:0!important;background:#f4f5f9!important;}
  #main-transparent{width:100%!important;max-width:100%!important;margin:0!important;padding:0!important;border-radius:0!important;background-image:none!important;background:#fff!important;box-shadow:none!important;}
  #main{padding:0!important;background:#fff!important;overflow:visible!important;}
  #topo{width:100%!important;overflow:hidden!important;}
  #topo img{width:100%!important;max-width:100%!important;height:auto!important;display:block!important;object-fit:cover!important;}
  #menu{display:none!important;}

  #corpo{width:100%!important;padding:12px 12px 20px 12px!important;background-image:none!important;background:#fff!important;min-height:auto!important;box-sizing:border-box!important;float:none!important;}
  #corpo h1{font-size:20px!important;color:#02142c!important;margin:0 0 4px 0!important;padding:0!important;font-family:Arial,sans-serif!important;font-weight:bold!important;line-height:1.2!important;}
  #corpo h2{font-size:12px!important;color:#02142c!important;margin:0 0 10px 0!important;padding:0!important;font-family:Arial,sans-serif!important;font-weight:normal!important;line-height:1.3!important;}
  #corpo > div{padding:0!important;}

  /* Textos de instrução no /confirmacao — mais compactos */
  #corpo > div > p{font-size:12.5px!important;line-height:1.4!important;margin:4px 0!important;padding:0!important;}

  /* Success box (/inscricao-realizada) */
  #corpo > div > div[style*="border-left"]{padding:10px 12px!important;margin:8px 0 12px 0!important;}
  #corpo > div > div[style*="border-left"] p{margin:2px 0!important;font-size:13px!important;line-height:1.35!important;}

  /* Tabelas /confirmacao e /realizada — label pequeno em cima, valor logo abaixo (2 linhas), mas compacto */
  table[data-testid="tabela-confirmacao"]{width:100%!important;margin-top:8px!important;}
  table[data-testid="tabela-confirmacao"] tr{display:block!important;padding:6px 0!important;border-bottom:1px solid #eee!important;}
  table[data-testid="tabela-confirmacao"] tr:last-child{border-bottom:0!important;}
  table[data-testid="tabela-confirmacao"] td{display:block!important;width:100%!important;padding:0!important;text-align:left!important;box-sizing:border-box!important;font-size:14px!important;line-height:1.35!important;word-break:break-word!important;}
  table[data-testid="tabela-confirmacao"] td:first-child{font-size:11.5px!important;font-weight:bold!important;color:#666!important;text-transform:uppercase!important;letter-spacing:0.3px!important;padding-bottom:2px!important;}

  /* Tabela genérica /realizada e /pagamento — mesmo tratamento */
  #corpo table:not([data-testid="tabela-confirmacao"]){width:100%!important;margin:6px 0!important;border-collapse:collapse!important;}
  #corpo table:not([data-testid="tabela-confirmacao"]) tr{display:block!important;padding:6px 0!important;border-bottom:1px solid #eee!important;}
  #corpo table:not([data-testid="tabela-confirmacao"]) tr:last-child{border-bottom:0!important;}
  #corpo table:not([data-testid="tabela-confirmacao"]) td{display:block!important;width:100%!important;padding:0!important;text-align:left!important;box-sizing:border-box!important;font-size:14px!important;line-height:1.35!important;white-space:normal!important;}
  #corpo table:not([data-testid="tabela-confirmacao"]) td:first-child{font-size:11.5px!important;font-weight:bold!important;color:#666!important;text-transform:uppercase!important;letter-spacing:0.3px!important;padding-bottom:2px!important;}

  /* Valor do PIX (destaque) */
  #corpo [data-testid="p-valor"]{font-size:18px!important;font-weight:bold!important;color:#02142c!important;}
  #corpo [data-testid="r-inscricao"]{font-size:15px!important;font-family:monospace!important;font-weight:bold!important;color:#02142c!important;word-break:break-all!important;}
  #corpo [data-testid="p-inscricao"]{font-size:14px!important;font-family:monospace!important;color:#02142c!important;word-break:break-all!important;}
  #corpo [data-testid="p-code"]{font-size:11px!important;line-height:1.3!important;}

  /* Status badge */
  #corpo [data-testid="r-status"] span{font-size:12px!important;padding:5px 10px!important;}

  /* Botões */
  #corpo button{-webkit-appearance:none!important;appearance:none!important;}
  #corpo #btn-alterar,#corpo #btn-confirmar,#corpo #btn-pagar,
  #corpo #p-btn-copy,#corpo #p-btn-print,#corpo #p-btn-voltar{
    display:block!important;width:100%!important;box-sizing:border-box!important;padding:13px 18px!important;font-size:14px!important;margin:8px 0!important;text-align:center!important;border-radius:999px!important;font-weight:bold!important;letter-spacing:0.4px!important;text-transform:uppercase!important;font-family:Arial,sans-serif!important;
  }

  /* PIX QR + textarea — empilhados e compactos */
  #pix-content > div[style*="flex-wrap"]{flex-direction:column!important;gap:12px!important;padding:12px!important;margin-top:8px!important;}
  #pix-content > div[style*="flex-wrap"] > div{width:100%!important;flex:1 1 100%!important;min-width:0!important;}
  #pix-content > div[style*="flex-wrap"] > div img{width:100%!important;max-width:240px!important;height:auto!important;padding:6px!important;}
  #pix-content > div[style*="flex-wrap"] > div:first-child{text-align:center!important;}
  #pix-content > div[style*="flex-wrap"] > div:first-child > p{font-size:13px!important;margin-bottom:6px!important;}
  #pix-content textarea{width:100%!important;box-sizing:border-box!important;font-size:11px!important;padding:8px!important;}

  /* Aviso amarelo */
